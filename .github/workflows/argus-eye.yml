name: Argus Eye

on:
  # schedule:
  #   - cron: '0 5 * * *'
  #     timezone: Asia/Hong_Kong

  workflow_dispatch:

  repository_dispatch:
    types: [ios-trigger]

permissions:
  contents: write

concurrency:
  group: argus-eye
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: npm ci

    - name: Restore Previous Pages
      run: |
        git fetch origin gh-pages || true
        if git ls-tree -r --name-only origin/gh-pages >/dev/null 2>&1; then
          git ls-tree -r --name-only origin/gh-pages | while read -r f; do
            mkdir -p "publish/$(dirname "$f")"
            git show "origin/gh-pages:$f" > "publish/$f" || true
          done
        fi

    - name: Run Argus Eye
      env:
        # secrets
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        GOOGLE_SPREAD_SHEET_ID: ${{ secrets.GOOGLE_SPREAD_SHEET_ID }}
        GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
        GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        # variables
        RESEARCH_TOPIC: ${{ vars.RESEARCH_TOPIC }}
        RESEARCH_URLS: ${{ vars.RESEARCH_URLS }}
        NODE_ENV: ${{ vars.NODE_ENV }}
      run: node index.mjs

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: publish
        publish_branch: gh-pages
        keep_history: true
        force_orphan: false
        enable_jekyll: true
        allow_empty_commit: false

    - name: Upload Debug Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crawler-step-outputs-${{ github.run_id }}
        path: debug/
        retention-days: 7
